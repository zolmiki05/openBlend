<div class="cp-wrap">
  <div class="blob blob--spotify" aria-hidden="true"></div>
  <div class="blob blob--apple" aria-hidden="true"></div>

  <main class="card" role="main">
    <header class="card__header">
      <div class="lock-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="title">Set Your Password</h1>
      <p class="subtitle">You're using a temporary password. Set a permanent one to continue.</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <!-- Current password -->
      <div class="field">
        <label class="field__label" for="current-pw">Current (temporary) password</label>
        <div class="field__pw-wrap">
          <input
            id="current-pw"
            class="field__input"
            [type]="showCurrent() ? 'text' : 'password'"
            formControlName="currentPassword"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button type="button" class="field__eye" (click)="showCurrent.update(v => !v)"
            [attr.aria-label]="showCurrent() ? 'Hide' : 'Show'">
            @if (showCurrent()) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>

      <!-- New password -->
      <div class="field">
        <label class="field__label" for="new-pw">New password</label>
        <div class="field__pw-wrap">
          <input
            id="new-pw"
            class="field__input"
            [type]="showNew() ? 'text' : 'password'"
            formControlName="newPassword"
            autocomplete="new-password"
            placeholder="At least 8 characters"
          />
          <button type="button" class="field__eye" (click)="showNew.update(v => !v)"
            [attr.aria-label]="showNew() ? 'Hide' : 'Show'">
            @if (showNew()) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>

        <!-- Strength meter -->
        @if (form.get('newPassword')?.value) {
          <div class="strength" [attr.aria-label]="'Password strength: ' + strengthLabel()">
            <div class="strength__bars">
              @for (i of [1,2,3,4,5]; track i) {
                <div class="strength__bar" [class]="i <= passwordStrength() ? 'strength__bar--' + strengthClass() : ''"></div>
              }
            </div>
            <span class="strength__label" [class]="'strength__label--' + strengthClass()">{{ strengthLabel() }}</span>
          </div>
        }
      </div>

      <!-- Confirm password -->
      <div class="field">
        <label class="field__label" for="confirm-pw">Confirm new password</label>
        <div class="field__pw-wrap">
          <input
            id="confirm-pw"
            class="field__input"
            [type]="showConfirm() ? 'text' : 'password'"
            formControlName="confirmPassword"
            autocomplete="new-password"
            placeholder="••••••••"
          />
          <button type="button" class="field__eye" (click)="showConfirm.update(v => !v)"
            [attr.aria-label]="showConfirm() ? 'Hide' : 'Show'">
            @if (showConfirm()) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>

      @if (error()) {
        <div class="error-msg" role="alert">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          {{ error() }}
        </div>
      }

      <button type="submit" class="btn-primary" [disabled]="form.invalid || loading()">
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>Saving…
        } @else {
          Set Password & Continue
        }
      </button>
    </form>
  </main>
</div>
