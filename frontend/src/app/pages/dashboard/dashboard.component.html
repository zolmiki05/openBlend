<div class="dashboard">
  <header class="dashboard__header">
    <div>
      <h1 class="dashboard__title">Dashboard</h1>
      <p class="dashboard__sub">Welcome back, {{ auth.currentUser()?.username }}.</p>
    </div>
    <button type="button" class="btn-sync" disabled aria-label="Sync now (coming soon)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Sync Now
    </button>
  </header>

  <!-- Platform connection status -->
  <section class="section" aria-label="Platform connections">
    <h2 class="section__title">Connections</h2>
    <div class="platform-cards">
      <div class="platform-card platform-card--spotify">
        <div class="platform-card__icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
        </div>
        <div class="platform-card__body">
          <span class="platform-card__name">Spotify</span>
          <span class="platform-card__status platform-card__status--pending">Not connected</span>
        </div>
        <button type="button" class="platform-card__btn platform-card__btn--spotify" disabled>
          Connect
        </button>
      </div>

      <div class="platform-card platform-card--apple">
        <div class="platform-card__icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
        </div>
        <div class="platform-card__body">
          <span class="platform-card__name">Apple Music</span>
          <span class="platform-card__status platform-card__status--pending">Not connected</span>
        </div>
        <button type="button" class="platform-card__btn platform-card__btn--apple" disabled>
          Connect
        </button>
      </div>
    </div>
  </section>

  <!-- Last sync / empty state -->
  <section class="section" aria-label="Sync history">
    <h2 class="section__title">Last Sync</h2>
    <div class="empty-state">
      <div class="empty-state__icon" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <p class="empty-state__title">No sync runs yet</p>
      <p class="empty-state__desc">Connect both platforms and run your first sync to see results here.</p>
    </div>
  </section>
</div>
