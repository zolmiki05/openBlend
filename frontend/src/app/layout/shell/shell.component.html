<div class="shell">
  <!-- Sidebar -->
  <nav class="sidebar" aria-label="Main navigation">
    <div class="sidebar__top">
      <a routerLink="/dashboard" class="sidebar__logo" aria-label="OpenBlend home">
        <span class="sidebar__logo-mark">OB</span>
        <span class="sidebar__logo-text">OpenBlend</span>
      </a>

      <ul class="nav-list" role="list">
        <li>
          <a
            routerLink="/dashboard"
            routerLinkActive="nav-item--active"
            class="nav-item"
            aria-current="page"
          >
            <svg class="nav-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            Dashboard
          </a>
        </li>
        <li>
          <a
            routerLink="/recommendations"
            routerLinkActive="nav-item--active"
            class="nav-item"
          >
            <svg class="nav-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
            </svg>
            Recommendations
          </a>
        </li>
        <li>
          <a
            routerLink="/validation"
            routerLinkActive="nav-item--active"
            class="nav-item"
          >
            <svg class="nav-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            Validation
          </a>
        </li>
        <li>
          <a
            routerLink="/llm-audit"
            routerLinkActive="nav-item--active"
            class="nav-item"
          >
            <svg class="nav-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
            </svg>
            LLM Audit
          </a>
        </li>
        <li>
          <a
            routerLink="/settings"
            routerLinkActive="nav-item--active"
            class="nav-item"
          >
            <svg class="nav-item__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Settings
          </a>
        </li>
      </ul>
    </div>

    <!-- User info + logout -->
    <div class="sidebar__bottom">
      <div class="user-info">
        <div class="user-info__avatar" aria-hidden="true">
          {{ auth.currentUser()?.username?.charAt(0)?.toUpperCase() }}
        </div>
        <div class="user-info__details">
          <span class="user-info__name">{{ auth.currentUser()?.username }}</span>
          <span class="user-info__platform"
            [class.user-info__platform--spotify]="auth.currentUser()?.platform === 'spotify'"
            [class.user-info__platform--apple]="auth.currentUser()?.platform === 'apple_music'">
            {{ auth.currentUser()?.platform === 'spotify' ? 'Spotify' : 'Apple Music' }}
          </span>
        </div>
      </div>
      <button type="button" class="logout-btn" (click)="auth.logout()" aria-label="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Main content -->
  <main class="main" id="main-content">
    <router-outlet />
  </main>
</div>
